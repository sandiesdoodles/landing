<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Cosmos – Full Bio</title>
  <link rel="stylesheet" href="../styles.css"/>
  <style>
    .wrap{ max-width: 980px; margin: 0 auto; padding: 18px; }
    .toprow{ display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .hero{ display:grid; grid-template-columns: 1.1fr 0.9fr; gap: 14px; margin-top: 12px; }
    .hero img{ width:100%; border-radius:18px; display:block; }
    .bio{ background: rgba(255,255,255,0.65); border: 1px solid rgba(0,0,0,0.06); border-radius:18px; padding: 14px 16px; }
    .bio p{ margin: 0 0 12px; line-height: 1.55; }
    .grid{ display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:12px; margin-top: 14px; }
    .grid img{ width:100%; border-radius:18px; display:block; }
    @media (max-width: 900px){
      .hero{ grid-template-columns: 1fr; }
      .grid{ grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="toprow">
      <h1 style="margin:0;">Cosmos</h1>
      <a href="../index.html#top" class="gallery-card" style="max-width:220px;"><span>Back to site</span><span class="arrow">←</span></a>
    </div>
</div>

    <div class="grid">
      <img src="../assets/pup_slides/cosmos_02.jpg" alt="Cosmos photo 2" loading="lazy"/>
      <img src="../assets/pup_slides/cosmos_03.jpg" alt="Cosmos photo 3" loading="lazy"/>
    </div>
  </div>
</body>
</html>
